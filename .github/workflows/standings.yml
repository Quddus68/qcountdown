name: Update NHL standings

on:
  schedule:
    - cron: '15 10 * * *'
    - cron: '15 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download standings
        run: |
          curl -fsS --retry 3 -o standings.tmp https://api-web.nhle.com/v1/standings/now
          python3 -c "import json; d=json.load(open('standings.tmp')); assert len(d['standings'])>=20; print(len(d['standings']), 'teams')"
          mv standings.tmp standings.json
      - name: Save if changed
        run: |
          git config user.name "standings-bot"
          git config user.email "actions@users.noreply.github.com"
          git add standings.json
          git diff --cached --quiet || (git commit -m "Update standings" && git push)

